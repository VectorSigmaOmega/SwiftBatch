name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "cmd/**"
      - "frontend/**"
      - "internal/**"
      - "deploy/docker/**"
      - "deploy/nginx/**"
      - "scripts/deploy-compose.sh"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: photon-deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ vars.PHOTON_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.PHOTON_DEPLOY_PORT || '22' }}
      DEPLOY_USER: ${{ vars.PHOTON_DEPLOY_USER || 'ubuntu' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy target configuration
        shell: bash
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PORT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Check embedded frontend assets
        run: git diff --exit-code -- internal/api/httpserver/static

      - name: Run tests
        run: go test ./...

      - name: Prepare SSH key
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.PHOTON_DEPLOY_SSH_PRIVATE_KEY }}' > ~/.ssh/photon_deploy_key
          chmod 600 ~/.ssh/photon_deploy_key
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Upload deployment bundle
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            -czf /tmp/photon-deploy.tgz \
            .
          scp -P "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key /tmp/photon-deploy.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/photon-deploy.tgz"

      - name: Upload environment file
        shell: bash
        env:
          PHOTON_POSTGRES_PASSWORD: ${{ secrets.PHOTON_POSTGRES_PASSWORD }}
          PHOTON_STORAGE_ACCESS_KEY: ${{ secrets.PHOTON_STORAGE_ACCESS_KEY }}
          PHOTON_STORAGE_SECRET_KEY: ${{ secrets.PHOTON_STORAGE_SECRET_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
        run: |
          test -n "$PHOTON_POSTGRES_PASSWORD"
          test -n "$PHOTON_STORAGE_ACCESS_KEY"
          test -n "$PHOTON_STORAGE_SECRET_KEY"

          root_user="${MINIO_ROOT_USER:-$PHOTON_STORAGE_ACCESS_KEY}"
          root_password="${MINIO_ROOT_PASSWORD:-$PHOTON_STORAGE_SECRET_KEY}"

          {
            printf 'PHOTON_ENV=production\n'
            printf 'PHOTON_COMPOSE_PROJECT=photon\n'
            printf 'PHOTON_POSTGRES_DB=photon\n'
            printf 'PHOTON_POSTGRES_USER=photon\n'
            printf 'PHOTON_POSTGRES_PASSWORD=%s\n' "$PHOTON_POSTGRES_PASSWORD"
            printf 'PHOTON_STORAGE_ACCESS_KEY=%s\n' "$PHOTON_STORAGE_ACCESS_KEY"
            printf 'PHOTON_STORAGE_SECRET_KEY=%s\n' "$PHOTON_STORAGE_SECRET_KEY"
            printf 'MINIO_ROOT_USER=%s\n' "$root_user"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$root_password"
            printf 'PHOTON_STORAGE_BUCKET=photon\n'
            printf 'PHOTON_STORAGE_PUBLIC_BASE_URL=https://storage.photon.abhinash.dev\n'
            printf 'PHOTON_STORAGE_USE_SSL=false\n'
            printf 'MINIO_API_CORS_ALLOW_ORIGIN=https://photon.abhinash.dev\n'
            printf 'MINIO_SERVER_URL=https://storage.photon.abhinash.dev\n'
            printf 'MINIO_BROWSER_REDIRECT_URL=https://minio.photon.abhinash.dev\n'
            printf 'PHOTON_WORKER_CONCURRENCY=2\n'
            printf 'PHOTON_API_PUBLISHED_PORT=18080\n'
            printf 'PHOTON_WORKER_METRICS_PUBLISHED_PORT=18081\n'
            printf 'PHOTON_MINIO_API_PUBLISHED_PORT=9000\n'
            printf 'PHOTON_MINIO_CONSOLE_PUBLISHED_PORT=9001\n'
          } > /tmp/photon.env

          scp -P "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key /tmp/photon.env \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/photon.env"

          ssh -p "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo install -m 0750 -o root -g ubuntu -d /etc/photon && sudo install -m 0640 -o root -g ubuntu /tmp/photon.env /etc/photon/photon.env && rm /tmp/photon.env'

      - name: Deploy to Docker Compose
        shell: bash
        run: |
          remote_release="/opt/photon/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ -e '$remote_release' ]; then echo 'release already exists: $remote_release' >&2; exit 1; fi && sudo install -d -m 0755 -o ubuntu -g ubuntu '$remote_release' && tar -xzf /tmp/photon-deploy.tgz -C '$remote_release' && rm /tmp/photon-deploy.tgz && sudo ln -sfn '$remote_release' /opt/photon/current && cd /opt/photon/current && ./scripts/deploy-compose.sh"

      - name: Install nginx site
        shell: bash
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key deploy/nginx/photon.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/photon-nginx.conf"
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/photon_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo install -m 0644 -o root -g root /tmp/photon-nginx.conf /etc/nginx/sites-available/photon && sudo ln -sfn /etc/nginx/sites-available/photon /etc/nginx/sites-enabled/photon && sudo nginx -t && sudo systemctl reload nginx && rm /tmp/photon-nginx.conf"
